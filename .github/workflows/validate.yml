name: Validate packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Validate (schemas, hashes, sizes, paths, licences; downloads release assets)
        run: python tools/duo_index.py validate --fetch-remote
